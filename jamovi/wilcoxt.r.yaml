---
name: wilcoxT
title: Wilcoxon T Test
jrs: '1.1'
refs: [DescTools]

items:
- name: wilcoxttest
  title: Wilcoxon T Test and ES Indices
  description: a table containing the Wilcoxon T test results
  type: Table
  rows: (pairs)
  visible: (wilcoxon || zstatps || rankCorrps)
  clearWith:
  - hypothesisps
  - ciWidthps
  - missps
  - pairs
  columns:
  - name: var1
    title: ''
    type: text
    combineBelow: true
    visible: (wilcoxon || zstatps)
  - name: var2
    title: ''
    type: text
    combineBelow: true
    visible: (wilcoxon || zstatps)
  - name: name[wilcoxon]
    title: ''
    type: text
    content: Wilcoxon T
    visible: (wilcoxon)
  - name: stat[wilcoxon]
    title: Statistic
    type: number
    visible: (wilcoxon)
  - name: p[wilcoxon]
    title: p
    type: number
    format: zto,pvalue
    visible: (wilcoxon)
  - name: name[zstatps]
    title: ''
    type: text
    content: z statistic
    visible: (zstatps)
  - name: stat[zstatps]
    title: Statistic
    type: number
    visible: (zstatps)
  - name: p[zstatps]
    title: p
    type: number
    format: zto,pvalue
    visible: (zstatps)
  - name: name[rankCorrps]
    title: ''
    type: text
    content: Rank-biserial correlation
    visible: (rankCorrps)
  - name: stat[rankCorrps]
    title: Statistic
    content: .
    visible: (rankCorrps)
- name: cisMedps
  title: Variables Medians CIs
  type: Table
  description: a table containing confidence interval estimates for the medians
  visible: (ciMediansps)
  rows: (pairs)
  clearWith:
  - missps
  - pairs
  - ciWidthps
  - ciMethodps
  - numR
  columns:
  - name: vars
    title: ''
    type: text
  - name: var[1]
    title: Variable
    type: text
  - name: median[1]
    title: Median
    type: number
  - name: cilMed[1]
    title: Lower bound
    type: number
  - name: ciuMed[1]
    title: Upper bound
    type: number
  - name: var[2]
    title: Variable
    type: text
  - name: median[2]
    title: Median
    type: number
  - name: cilMed[2]
    title: Lower bound
    type: number
  - name: ciuMed[2]
    title: Upper bound
    type: number
- name: cisHLps
  title: Hodges-Lehmann Estimator CIs
  type: Table
  description: a table containing confidence interval estimates for HL estimator
  visible: (ciHLps)
  rows: (pairs)
  clearWith:
  - missps
  - pairs
  - ciWidthps
  - ciMethodps
  - numR
  columns:
  - name: vars
    title: ''
    type: text
  - name: hlestimate
    title: Hodges-Lehmann estimator
    type: number
  - name: cilHL
    title: Lower bound
    type: number
  - name: ciuHL
    title: Upper bound
    type: number
- name: descps
  title: Variables Descriptives
  type: Table
  description: a table containing the group descriptives
  visible: (descps)
  rows: 0
  clearWith:
  - pairs
  - missps
  columns:
  - name: var1
    title: Measure 1
    type: text
    combineBelow: true
  - name: var2
    title: Measure 2
    type: text
    combineBelow: true
  - name: sign
    title: Differences
    type: text
  - name: num
    title: N
    type: integer
  - name: rankA
    title: Average rank
    type: number
  - name: rankS
    title: Rank sum
    type: number
- name: plotsps
  title: Plots
  type: Array
  description: an array of groups of plots
  items: (pairs)
  clearWith:
  - missps
  - ciWidthps
  - pairs
  - ciMethodps
  - numR
  template:
    title: Plots
    type: Group
    items:
    - name: descps
      type: Image
      width: 450
      height: 400
      description: descriptives plot
      visible: (plotsps)
      renderFun: .desc
      clearWith:
      - pairs
      - missps
      - ciWidthps
      - ciMethodps
      - numR
...
