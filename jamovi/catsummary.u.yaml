title: Categorical Data
name: catSummary
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    name: nominalSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variables
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: freq
  - type: CollapseBox
    label: Statistics
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        cell:
          column: 0
          row: 0
        children:
          - type: CheckBox
            name: mode
          - type: CheckBox
            name: Blau
          - type: CheckBox
            name: VR
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        cell:
          column: 1
          row: 0
        children:
          - type: CheckBox
            name: Teachman
          - type: CheckBox
            name: IQV
            label: IQV
            children:
              - type: TextBox
                name: NCat
                label: Categories (0 = automatic)
                format: number
                enable: (IQV)
  - type: CollapseBox
    label: Plots
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        cell:
          column: 0
          row: 0
        fitToGrid: true
        children:
          - type: CheckBox
            name: pie
          - type: CheckBox
            name: dough
          - type: CheckBox
            name: lolli
            children:
              - name: f2p.lolli
                margin: small
                type: ComboBox
                label: Frequencies (Y-axis)
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        cell:
          column: 1
          row: 0
        fitToGrid: true
        children:
          - type: CheckBox
            name: pareto
          - type: CheckBox
            name: bar
            children:
              - name: f2p.bar
                margin: small
                type: ComboBox
                label: Frequencies (Y-axis)
